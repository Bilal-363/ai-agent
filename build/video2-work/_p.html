<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{position:relative;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 70% at 15% 0%,#1E2A7A 0%,transparent 55%),
      linear-gradient(165deg,#0B1030 0%,#141A4E 55%,#1A1140 100%)}
  h1{font-weight:800;font-size:88px;line-height:1.06;letter-spacing:-.04em;text-wrap:balance}
  h1 em{font-style:normal;color:#FF9A3D}
  
  .bar{position:absolute;top:56px;left:64px;right:64px;display:flex;align-items:center;
    justify-content:space-between;z-index:40}
  .bar .lk{display:flex;align-items:center;gap:14px}
  .bar img{width:78px;height:auto;display:block}
  .bar .wm{font-weight:800;font-size:30px;letter-spacing:-.02em;color:#fff}
  .bar .wm b{color:#FF9A3D}
  .bar .site{font-weight:800;font-size:26px;color:rgba(255,255,255,.62)}


  .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:44px;text-align:center;padding:0 72px;
    transform:scale(var(--z,1))}
  .mid img{width:330px;height:auto;opacity:var(--o1,0)}
  .wordmark{font-weight:800;font-size:74px;letter-spacing:-.03em;opacity:var(--o1,0)}
  .wordmark span{color:#FF9A3D}
  .cta{font-weight:800;font-size:46px;background:#FF8A2B;color:#0B1030;padding:30px 60px;
    border-radius:999px;letter-spacing:-.02em;opacity:var(--o2,0);
    box-shadow:0 20px 50px -18px rgba(255,138,43,.75)}
  .tag{font-weight:600;font-size:34px;color:rgba(255,255,255,.68);opacity:var(--o2,0)}
</style></head><body><div class="bar"><div class="lk"><img src="file:///D:/Ai%20agents/vocryn-website/build/logo-src/mark-hi.png" alt="">
  <span class="wm">VOCRYN <b>Ai</b></span></div>
  <span class="site">vocryn.com</span></div>
  <div class="mid" id="m">
    <img src="file:///D:/Ai%20agents/vocryn-website/build/logo-src/mark-hi.png" alt="">
    <div class="wordmark">VOCRYN <span>Ai</span></div>
    <div class="cta">vocryn.com</div>
    <div class="tag">Hear a real call, unedited</div>
  </div>
<script>
  const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  window.setP = (p) => {
    const m = document.getElementById('m');
    m.style.setProperty('--o1', ease(p / 0.30).toFixed(3));
    m.style.setProperty('--o2', ease((p - 0.25) / 0.30).toFixed(3));
    m.style.setProperty('--z', (1 + p * 0.03).toFixed(4));
  };
  window.setP(0);
</script></body></html>
